<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Poblado Hoyorrico</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

<!-- Conecta el codigo de CSS  -->

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-measure/dist/leaflet-measure.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.control.layers.tree/L.Control.Layers.Tree.css" />
</head>
<body>

    <!-- contenido general de todo el Geovisor -->

    <div id="app">

        <!-- Renderización del mapa  -->

        <div id="map">
                  
        <!-- TABLA DENTRO DEL MAPA -->
        <div id="tablaAtributos" class="panel-info" style="display:none;">
        <div class="panel-header">Tabla de atributos</div>
        <div class="panel-body" id="tablaContenido"></div>    
    </div>

</div>   

        
        <!-- Contenido de la barra (Panel de control, Dashboard y Tabla) -->

        <div id="panelInferior">

    <div class="acordeon">

        <!-- 1. INFORMACIÓN DE CAPAS -->

        <div class="acordeon-item">
            <div class="acordeon-header" onclick="toggleAcordeon(this)">
                Información de atributos de las capas
            </div>

            <div class="acordeon-body">
                <div id="panelConsulta" class="panel-botones-body">

                    <label><b>Capa a consultar:</b></label>

                    <select id="selectorCapa"></select>

                    <button onclick="toggleDashboard()">Mostrar / Ocultar Dashboard</button>
                    <button onclick="toggleTabla()">Mostrar / Ocultar Tabla</button>

                </div>
            </div>
        </div>

        

        <!-- 3. PANEL DASHBOARD -->
        <div class="acordeon-item">
            <div class="acordeon-header" onclick="toggleAcordeon(this)">
                

                Informacion general 
            </div>

            <div class="acordeon-body">
                <div id="dashboard" style="display:none;">
                    <div id="dashboardContenido"></div>
                </div>
            </div>
        </div>

    </div>


    
</div>

    <!-- TABLA (SE MANTIENE OCULTA Y FUERA DEL ACORDEÓN) --> 
    <div id="tablaAtributosMapa" class="panel-info" style="display:none;">
    <div class="panel-header">Tabla de atributos</div>
    <div class="panel-body" id="tablaContenido"></div>    

    </div>

</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-measure/dist/leaflet-measure.js"></script>
    <script src="https://unpkg.com/leaflet.control.layers.tree/L.Control.Layers.Tree.js"></script>
    <script src="scripts.js"></script>

</body>
</html>
